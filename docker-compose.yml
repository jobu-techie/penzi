services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: REDACTED
      MYSQL_DATABASE: penzi
      MYSQL_USER: techie
      MYSQL_PASSWORD: REDACTED
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pREDACTED"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
